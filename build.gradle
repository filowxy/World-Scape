plugins {
    id 'net.neoforged.moddev' version '2.0.125'
}

neoForge {
    version = "21.1.219"

    mods {
        worldscape {
            sourceSet sourceSets.main
        }
    }

    // Mixin configuration for NeoForge 21.1.219
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    // Access Transformer for exposing final fields
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
}

dependencies {
    // Mixin annotation processor
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('runSeedAnalyzer', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.worldscape.analyzer.SeedAnalyzer'
    def seedArgs = project.findProperty('seedArgs')
    if (seedArgs != null) {
        args seedArgs.split(' ')
    } else {
        args '--help'
    }
}

test {
    useJUnitPlatform()

    // Include NeoForge/Minecraft dependencies on the test classpath.
    // ModDev 2.0 injects Minecraft via the main sourceSet runtimeClasspath
    // but does not automatically extend the test classpath with it.
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
}
